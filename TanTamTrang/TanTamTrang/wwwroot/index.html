  <!-- The intro plays once per visit: switched on here, before first paint,
       only when it has not played yet this session (add ?intro to the address
       to see it again). Without script it simply never appears; and if the
       main script never arrives, it is switched off again after a few seconds. -->
  <script>(function(){var d=document.documentElement,seen=false;try{seen=sessionStorage.getItem('tttIntroSeen')==='1';}catch(e){}if(seen&&!/[?&]intro\b/.test(location.search))return;d.classList.add('intro-on');setTimeout(function(){if(!window.introStarted&&!window.introFinished)d.classList.remove('intro-on');},9000);})();</script>

<body class="home-video-body">

  <!-- Intro (script.js, "HOME INTRO"). About seven seconds:
       darkness with a little timecode and film grain; the TANTAMTRANG mark
       glitching in and resolving clean; the mark blinking out; the clips
       laid on a pile one by one like sheets of paper, bugs-home last, which
       zooms to fill the screen; and the homepage underneath taking over on
       that same clip. Played once per visit
       (sessionStorage); SKIP INTRO or Esc ends it at once; reduced motion
       gets a short still reveal; without script it never shows (it is only
       switched on by the script in <head>). -->
  <div id="camcorder-preloader" data-nosnippet>
    <div class="cam-hud" id="camHud" aria-hidden="true">
      <div class="cam-row cam-top">
        <span class="cam-grp"><span></span><span>TANTAMTRANG</span></span>
        <span class="cam-grp"><span>16:9</span><span class="cam-batt"><i></i><i></i><i></i></span></span>
      </div>
      <div class="cam-row cam-bottom">
        <span class="cam-grp"><span id="camTime">AM 00 : 00 : 00</span><span id="camDate">JAN. 01 2026</span></span>
        <span class="cam-grp cam-mid"><span>F4.5</span><span>ISO AUTO</span><span>1/50</span></span>
        <span class="cam-grp"><span>4K</span><span>60FPS</span></span>
      </div>
    </div>
    <h1 class="loading-title" id="igLogo" data-text="TANTAMTRANG">TANTAMTRANG</h1>
   
    <div class="ig-grain" aria-hidden="true"></div>
  </div>

  <!-- The clips the intro lays on a pile once the mark has blinked out,
       one sheet at a time in this order; bugs-home last, which then zooms
       to fill the screen - the clip the homepage opens on. Fetched only
       when the intro actually plays. -->

  <!-- Infinite video reel — clips hosted as GitHub Release assets (CDN-backed,
       not counted against Pages). Posters ship with the site so each slide
       shows instantly while its clip streams in.
       Each clip is on the release twice: 1080p under this name, and a 720p
       copy named -720.mp4 that script.js swaps in on phones, tablets and slow
       connections. None of them autoplays or preloads: autoplay overrode
       preload="none", so all eight began downloading the moment the page
       opened, and a phone would have started on the 1080p file before the
       script could choose. script.js plays each clip as it comes on screen. -->
  <main class="home-reel" id="homeReel">
    <div class="home-reel-stage" id="homeReelStage" aria-hidden="true">
      <div class="home-slide">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/bugs-home.mp4"
               poster="images/poster/bugs-home.jpg" muted loop playsinline preload="none"></video>
