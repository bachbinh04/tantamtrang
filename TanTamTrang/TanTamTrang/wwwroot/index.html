<body class="home-video-body">

  <!-- Intro Preloader -->
  <div id="camcorder-preloader">
    <div class="camcorder-ui">
      <h1 class="loading-title">TANTAMTRANG</h1>
    </div>
  </div>

  <!-- 3D intro canvas -->
  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div class="page-transition" id="pageTransition" aria-hidden="true">
    <div class="transition-frame transition-frame-1"></div>
    <div class="transition-frame transition-frame-2"></div>
    <div class="transition-frame transition-frame-3"></div>
    <div class="transition-frame transition-frame-4"></div>
    <div class="transition-frame transition-frame-5"></div>
    <div class="transition-ui">
      <span id="transitionFrom">CURRENT</span>
      <span>→</span>
      <span id="transitionTo">NEXT</span>
    </div>
  </div>
  <div class="page-enter-curtain" id="pageEnterCurtain"></div>

  <!-- Home <-> Works transition -->
  <div class="hw-transition" id="hwTransition" aria-hidden="true">
    <div class="hw-frame hw-frame-1"></div>
    <div class="hw-frame hw-frame-2"></div>
    <div class="hw-frame hw-frame-3"></div>
    <div class="hw-frame hw-frame-4"></div>
    <div class="hw-frame hw-frame-5"></div>
    <div class="hw-black"></div>
    <div class="transition-ui">
      <span id="hwFrom">HOME</span>
      <span>→</span>
      <span id="hwTo">WORKS</span>
    </div>
  </div>

  <header class="topbar">
    <div class="brand-static">TanTamTrang</div>
    <nav class="topnav">
      <a href="index.html" class="active">Home</a>
      <a href="works.html">Works</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- Infinite video reel — clips hosted as GitHub Release assets (CDN-backed,
       not counted against Pages). Posters ship with the site so each slide
       shows instantly while its clip streams in.
       Each clip is on the release twice: 1080p under this name, and a 720p
       copy named -720.mp4 that script.js swaps in on phones, tablets and slow
       connections. None of them autoplays or preloads: autoplay overrode
       preload="none", so all eight began downloading the moment the page
       opened, and a phone would have started on the 1080p file before the
       script could choose. script.js plays each clip as it comes on screen. -->
  <main class="home-reel" id="homeReel">
    <!-- Clicking a clip opens its detail view (script.js). Its words come from
         the attributes on each slide below, in reel order:
           data-title     the big title in the corner of the clip
           data-client    Client          data-category  Category
           data-year      Year            data-role      Role (commas: one per line)
           data-desc      the description on the right
         Leave one empty and that line is not shown; the length is read from the
         clip itself. The titles are placeholders taken from the file names. -->
    <div class="home-reel-stage" id="homeReelStage" aria-hidden="true">
      <div class="home-slide" data-title="BUGS" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/bugs-home.mp4"
               poster="images/poster/bugs-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="CITY" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/city-home.mp4"
               poster="images/poster/city-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="FISH" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/fish-home.mp4"
               poster="images/poster/fish-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="VIDEO" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/video-home.mp4"
               poster="images/poster/video-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="CANYON" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/canyon-home.mp4"
               poster="images/poster/canyon-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="MONO" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video home-video-mono" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/mono-home.mp4"
               poster="images/poster/mono-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="EMBER" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/ember-home.mp4"
               poster="images/poster/ember-home.jpg" muted loop playsinline preload="none"></video>
      </div>
      <div class="home-slide" data-title="C-WORKS" data-client="" data-category="" data-year="" data-role="" data-desc="">
        <video class="home-video home-video-mono" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/c-works.mp4"
               poster="images/poster/c-works.jpg" muted loop playsinline preload="none"></video>
      </div>
    </div>
    <div class="home-reel-spacer" id="homeReelSpacer" aria-hidden="true"></div>
  </main>

  <!-- The detail view a clip opens (script.js): the clip settles into a band
       across the top with its title in the corner, the rest of the reel goes,
       and its details come up below on black. -->
  <section class="home-detail" id="homeDetail" aria-hidden="true" aria-label="Clip details">
    <div class="hd-shade" aria-hidden="true"></div>
    <button class="hd-hero" id="hdHero" type="button" aria-label="Back to the reel"></button>
    <div class="hd-title-mask"><h2 class="hd-title" id="hdTitle"></h2></div>
    <div class="hd-sheet">
      <div class="hd-body">
        <div class="hd-left">
          <button class="hd-back" id="hdBack" type="button">Back</button>
          <dl class="hd-rows">
            <div class="hd-row" data-field="client"><dt>Client</dt><dd></dd></div>
            <div class="hd-row" data-field="category"><dt>Category</dt><dd></dd></div>
            <div class="hd-row" data-field="year"><dt>Year</dt><dd></dd></div>
            <div class="hd-row" data-field="role"><dt>Role</dt><dd></dd></div>
            <div class="hd-row" data-field="length"><dt>Length</dt><dd></dd></div>
          </dl>
        </div>
        <p class="hd-desc" id="hdDesc" hidden></p>
      </div>
      <div class="hd-foot"><span id="hdNo"></span><span class="hd-clock" id="hdClock"></span></div>
    </div>
  </section>

  <!-- Libraries for the 3D intro -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script src="script.js?v=132"></script>
</body>
