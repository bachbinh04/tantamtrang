<main class="poster-page vid-page">
  <section class="poster-hero">
    <p class="kicker">WORKS / 3D / VIDEO</p>
    <h1 class="page-title poster-title">3D / VIDEO</h1>
    <p class="poster-intro">Two moving pieces, each running on a continuous loop.</p>
    <a class="poster-back" href="works.html">← Back to Works</a>
  </section>

  <!-- Both clips are 30s loops, silent, on the repository's "media" release
       rather than in the site itself, so the pages stay light. Each is there
       twice: 1080p under this name and a 720p copy named -720.mp4, which
       script.js swaps in on phones, tablets and slow connections - and so
       neither autoplays or preloads here, or a phone would start on the 1080p
       file before the script could choose. They play only while on screen and
       pause when scrolled away or when the tab is hidden. muted + playsinline
       is what lets a phone play them without a tap. -->
  <section class="vid-grid">
    <figure class="vid-item vid-a">
      <div class="vid-frame">
        <video class="vid" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/fire.mp4" width="1920" height="1080"
               muted loop playsinline preload="none"
               disablepictureinpicture aria-label="Fire, looping video"></video>
      </div>
      <figcaption>
        <span class="vid-no">N°01</span>
        <span class="vid-name">FIRE</span>
        <span class="vid-meta"><i class="vid-live" aria-hidden="true"></i>0:30 · LOOP</span>
      </figcaption>
    </figure>

    <figure class="vid-item vid-b">
      <div class="vid-frame">
        <video class="vid" src="https://github.com/bachbinh04/tantamtrang/releases/download/media/fire-ball.mp4" width="1920" height="1080"
               muted loop playsinline preload="none"
               disablepictureinpicture aria-label="Fire ball, looping video"></video>
      </div>
      <figcaption>
        <span class="vid-no">N°02</span>
        <span class="vid-name">FIRE BALL</span>
        <span class="vid-meta"><i class="vid-live" aria-hidden="true"></i>0:30 · LOOP</span>
      </figcaption>
    </figure>
  </section>
</main>
